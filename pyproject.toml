[project]
name = "plotly-themes"
version = "0.1.0"
description = "A collection of fun, ready-to-use visual themes for Plotly, registered automatically on import."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Malhar" }]
keywords = ["plotly", "themes", "templates", "dataviz", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "plotly>=5.0",
]

[project.urls]
Homepage = "https://github.com/Malhar/plotly-themes"
Repository = "https://github.com/Malhar/plotly-themes"

[tool.uv]
# This network rejects PyPI's default certificate chain; use the OS trust store.
native-tls = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotly_themes"]
# Bundle the font binaries and their licences alongside the Python code.
artifacts = ["**/*.ttf", "**/LICENSE-OFL.txt", "**/NOTICE.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "kaleido>=0.2.1",
]
